<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stock Ripple — Live NSE/BSE Screener</title>
<style>
  :root { --bg-main:#090b10; --bg-card:#10141d; --bg-hover:#161b26; --border:#1e2533; --text-main:#e2e8f0; --text-muted:#94a3b8; --green:#34d399; --green-bg:rgba(16,185,129,0.14); --red:#fb7185; --red-bg:rgba(244,63,94,0.14); --amber:#fbbf24; }
    * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg-main); color:var(--text-main); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; line-height:1.4; }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; }
  header { background:rgba(16,20,29,0.95); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20; padding:12px 16px; }
  .header-inner { max-width:1360px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  .brand { display:flex; align-items:center; gap:8px; font-weight:800; font-size:16px; color:#fff; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); }
  .brand span { color:var(--green); }
  .controls-top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .status { font-size:12px; color:var(--text-muted); margin-right:4px; }
  button,.btn-label { background:var(--bg-card); border:1px solid var(--border); color:var(--text-main); padding:6px 12px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:5px; }
  .btn-primary { background:var(--green-bg); color:var(--green); border-color:rgba(52,211,153,0.35); }
  main { max-width:1360px; margin:0 auto; padding:16px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
  .card { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
  .card-label { font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-muted); }
  .card-val { font-size:24px; font-weight:700; margin-top:4px; }
  .toolbar { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
  .search-box { flex:1 1 240px; background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:9px 14px; color:#fff; font-size:13px; outline:none; }
  .filter-group { display:flex; align-items:center; background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:4px 10px; gap:6px; font-size:12px; color:var(--text-muted); }
  .filter-group input { background:transparent; border:none; color:var(--green); font-weight:700; width:65px; font-size:12px; outline:none; }
  .add-group { display:flex; background:var(--bg-card); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .add-group input { background:transparent; border:none; padding:8px 10px; color:#fff; font-size:12px; width:125px; text-transform:uppercase; outline:none; }
  .add-group button { border:none; border-left:1px solid var(--border); border-radius:0; background:#182030; color:var(--green); }
  select { background:var(--bg-card); border:1px solid var(--border); color:#fff; padding:8px 12px; border-radius:10px; font-size:12px; outline:none; }
  .table-wrap { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; text-align:left; min-width:820px; }
  th { background:#0c0f16; color:var(--text-muted); font-size:11px; text-transform:uppercase; letter-spacing:0.5px; padding:12px 14px; border-bottom:1px solid var(--border); }
  td { padding:11px 14px; border-bottom:1px solid rgba(30,37,51,0.7); font-size:13px; white-space:nowrap; }
  tr:hover td { background:var(--bg-hover); }
  .right { text-align:right; } .pos { color:var(--green); } .neg { color:var(--red); } .neu { color:var(--text-main); }
  .badge { display:inline-block; padding:3px 8px; border-radius:6px; font-size:12px; font-weight:600; }
  .badge-pos { background:var(--green-bg); color:var(--green); } .badge-neg { background:var(--red-bg); color:var(--red); } .badge-neu { background:#1e2533; color:var(--text-muted); }
  .deliv-hi { background:rgba(251,191,36,0.15); color:var(--amber); padding:2px 6px; border-radius:5px; }
  .company-cell { color:var(--text-muted); max-width:180px; overflow:hidden; text-overflow:ellipsis; }
  .del-btn { background:none; border:none; color:#475569; padding:2px 6px; font-size:13px; }
</style>
</head>
<body>
<header><div class="header-inner"><div class="brand"><div class="dot"></div>STOCK <span>RIPPLE</span></div><div class="controls-top"><span id="statusText" class="status mono">Ready</span><button onclick="resetWatchlist()">Reset List</button><label class="btn-label"><input type="checkbox" id="autoRefreshToggle" checked> Auto</label><button class="btn-primary" onclick="fetchAllStocks()">Refresh</button></div></div></header>
<main>
  <div class="cards">
    <div class="card"><div class="card-label mono">Advances (≥₹100)</div><div id="advancesCount" class="card-val mono pos">0</div></div>
    <div class="card"><div class="card-label mono">Declines (≥₹100)</div><div id="declinesCount" class="card-val mono neg">0</div></div>
    <div class="card"><div class="card-label mono">Unchanged</div><div id="unchangedCount" class="card-val mono">0</div></div>
    <div class="card"><div class="card-label mono">Quotes Loaded</div><div id="loadedCount" class="card-val mono" style="color:var(--amber)">0/0</div></div>
  </div>
  <div class="toolbar">
    <input type="text" id="searchInput" class="search-box" oninput="renderTable()" placeholder="Search symbol or company..." />
    <div class="filter-group mono"><span>MIN ₹</span><input type="number" id="minPriceInput" value="100" oninput="updateSummaryCards(); renderTable();" /></div>
    <div class="add-group"><input type="text" id="newSymbolInput" class="mono" placeholder="TCS / 500325.BO" onkeydown="if(event.key==='Enter') addCustomSymbol()" /><button onclick="addCustomSymbol()">+ Add</button></div>
    <label class="btn-label">Upload CSV<input type="file" accept=".csv,.txt" onchange="handleCSVUpload(event)" style="display:none" /></label>
    <select id="sortSelect" onchange="renderTable()"><option value="chgPctDesc">% Change ↓</option><option value="chgPctAsc">% Change ↑</option><option value="ltpDesc">LTP ↓</option><option value="volDesc">Volume ↓</option><option value="delivDesc">Prev Deliv % ↓</option></select>
  </div>
  <div class="table-wrap"><table><thead><tr class="mono"><th>#</th><th>Symbol</th><th>Company</th><th class="right">LTP</th><th class="right">Chg</th><th class="right">Chg %</th><th class="right">Day Low</th><th class="right">Day High</th><th class="right">Volume</th><th class="right">Prev Deliv %</th><th class="right">Updated</th><th></th></tr></thead><tbody id="stockTableBody"></tbody></table></div>
</main>
