<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Ripple — Live NSE Market Screener</title>
  <script src="https://tailwindcss.com"></script>
  <link href="https://googleapis.com" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            bgMain: '#090b10',
            bgCard: '#10141d',
            bgRowHover: '#161b26',
            borderSubtle: '#1e2533',
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #090b10; color: #e2e8f0; }
  </style>
</head>
<body class="min-h-screen antialiased">

  <header class="border-b border-borderSubtle bg-bgCard/90 sticky top-0 z-30 backdrop-blur">
    <div class="max-w-[1440px] mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></div>
        <h1 class="font-bold tracking-tight text-white text-base sm:text-lg">
          STOCK <span class="text-emerald-400">RIPPLE</span>
        </h1>
      </div>
      <div class="flex items-center gap-2.5">
        <span id="statusText" class="text-xs font-mono text-slate-400">Ready</span>
        <button onclick="resetWatchlist()" class="px-2.5 py-1.5 rounded-lg bg-bgMain hover:bg-slate-800 text-slate-300 border border-borderSubtle text-xs font-medium">
          Reset List
        </button>
        <label class="flex items-center gap-1.5 text-xs text-slate-400 cursor-pointer bg-bgMain px-2.5 py-1.5 rounded-lg border border-borderSubtle">
          <input type="checkbox" id="autoRefreshToggle" checked onchange="toggleAutoRefresh()" class="accent-emerald-500">
          <span>Auto</span>
        </label>
        <button onclick="fetchAllStocks()" class="px-3 py-1.5 rounded-lg bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-400 border border-emerald-500/30 text-xs font-medium">
          Refresh
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-[1440px] mx-auto px-4 sm:px-6 py-5 space-y-5">
    <div id="diagBanner" class="hidden bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs font-mono px-4 py-2.5 rounded-xl"></div>

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
      <div class="bg-bgCard border border-borderSubtle rounded-xl p-4">
        <div class="text-[11px] font-mono uppercase text-slate-400">Advances</div>
        <div id="advancesCount" class="text-2xl font-bold font-mono text-emerald-400 mt-1">0</div>
      </div>
      <div class="bg-bgCard border border-borderSubtle rounded-xl p-4">
        <div class="text-[11px] font-mono uppercase text-slate-400">Declines</div>
        <div id="declinesCount" class="text-2xl font-bold font-mono text-rose-400 mt-1">0</div>
      </div>
      <div class="bg-bgCard border border-borderSubtle rounded-xl p-4">
        <div class="text-[11px] font-mono uppercase text-slate-400">Unchanged</div>
        <div id="unchangedCount" class="text-2xl font-bold font-mono text-white mt-1">0</div>
      </div>
      <div class="bg-bgCard border border-borderSubtle rounded-xl p-4">
        <div class="text-[11px] font-mono uppercase text-slate-400">Quotes Loaded</div>
        <div id="loadedCount" class="text-2xl font-bold font-mono text-amber-400 mt-1">0/0</div>
      </div>
    </div>

    <div class="flex flex-col md:flex-row gap-3 justify-between">
      <input type="text" id="searchInput" oninput="renderTable()" placeholder="Search symbol or company..." class="flex-1 bg-bgCard border border-borderSubtle rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500" />
      <div class="flex items-center gap-2">
        <div class="flex items-center bg-bgCard border border-borderSubtle rounded-xl overflow-hidden">
          <input type="text" id="newSymbolInput" placeholder="Add NSE (e.g. TCS)" class="bg-transparent px-3 py-2 text-xs font-mono uppercase text-white placeholder-slate-500 focus:outline-none w-36" onkeydown="if(event.key==='Enter') addCustomSymbol()" />
          <button onclick="addCustomSymbol()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-medium text-emerald-400 border-l border-borderSubtle">+ Add</button>
        </div>
        <select id="sortSelect" onchange="renderTable()" class="bg-bgCard border border-borderSubtle rounded-xl px-3 py-2 text-xs font-medium text-white focus:outline-none">
          <option value="chgPctDesc">% Change ↓</option>
          <option value="chgPctAsc">% Change ↑</option>
          <option value="ltpDesc">LTP ↓</option>
          <option value="volDesc">Volume ↓</option>
          <option value="delivDesc">Prev Deliv % ↓</option>
        </select>
      </div>
    </div>

    <div class="bg-bgCard border border-borderSubtle rounded-xl overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-borderSubtle text-[11px] font-mono uppercase text-slate-400 bg-bgMain/60">
              <th class="py-3 px-4">#</th>
              <th class="py-3 px-4">Symbol</th>
              <th class="py-3 px-4">Company</th>
              <th class="py-3 px-4 text-right">LTP</th>
              <th class="py-3 px-4 text-right">Chg</th>
              <th class="py-3 px-4 text-right">Chg %</th>
              <th class="py-3 px-4 text-right">Day Low</th>
              <th class="py-3 px-4 text-right">Day High</th>
              <th class="py-3 px-4 text-right">Volume</th>
              <th class="py-3 px-4 text-right">Prev Deliv %</th>
              <th class="py-3 px-4 text-right">Updated</th>
              <th class="py-3 px-4"></th>
            </tr>
          </thead>
          <tbody id="stockTableBody" class="divide-y divide-borderSubtle/70 text-sm"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const DEFAULT_SYMBOLS = [
      "RELIANCE|Reliance Industries Ltd", "TCS|Tata Consultancy Services", "HDFCBANK|HDFC Bank Ltd",
      "BHARTIARTL|Bharti Airtel Ltd", "ICICIBANK|ICICI Bank Ltd", "INFY|Infosys Ltd",
      "SBIN|State Bank of India", "HINDUNILVR|Hindustan Unilever Ltd", "ITC|ITC Ltd",
      "LT|Larsen & Toubro Ltd", "HCLTECH|HCL Technologies Ltd", "BAJFINANCE|Bajaj Finance Ltd",
      "SUNPHARMA|Sun Pharmaceutical Ind", "M&M|Mahindra & Mahindra Ltd", "MARUTI|Maruti Suzuki India Ltd",
      "KOTAKBANK|Kotak Mahindra Bank", "AXISBANK|Axis Bank Ltd", "TITAN|Titan Company Ltd",
      "ULTRACEMCO|UltraTech Cement Ltd", "NTPC|NTPC Ltd", "ONGC|Oil & Natural Gas Corp"
    ];

    let nseStaticData = {};
    let stocks = [];
    let refreshTimer = null;

    function showDiag(msg) {
      const el = document.getElementById("diagBanner");
      if (el) {
        el.textContent = msg;
        el.classList.remove("hidden");
      }
    }

    function createStockObj(symbol, company = "") {
      const cleanSym = String(symbol || "").trim().toUpperCase();
      const meta = nseStaticData[cleanSym] || {};
      return {
        symbol: cleanSym,
        company: company || meta.company || cleanSym,
        ltp: null,
        prevClose: meta.prevClose || null,
        chg: 0,
        chgPct: 0,
        low: null,
        high: null,
        volume: 0,
        delivPct: meta.prevDelivPct || 0,
        updated: "--:--:--"
      };
    }

    function loadInitialList() {
      try {
        const saved = localStorage.getItem("stock_ripple_v4");
        if (saved) {
          stocks = JSON.parse(saved);
          return;
        }
      } catch (e) {}

      stocks = DEFAULT_SYMBOLS.map(entry => {
        const parts = entry.split("|");
        return createStockObj(parts.shift(), parts.shift());
      });
    }

    async function loadNseJson() {
      try {
        const res = await fetch("nse_data.json?t=" + Date.now());
        if (!res.ok) {
          showDiag("nse_data.json returned HTTP " + res.status + " (check filename in repo). Using default watchlist.");
          return;
        }
        const raw = await res.json();

        if (Array.isArray(raw)) {
          raw.forEach(item => {
            if (!item || typeof item !== "object") return;
            const sym = String(item.symbol || item.SYMBOL || item.Symbol || "").trim().toUpperCase();
            if (sym) {
              nseStaticData[sym] = {
                company: item.company || item.COMPANY || item.name || sym,
                prevDelivPct: parseFloat(item.prevDelivPct ?? item.DELIV_PER ?? item.deliv ?? 0) || 0,
                prevClose: parseFloat(item.prevClose ?? item.CLOSE_PRICE ?? item.close ?? 0) || null
              };
            }
          });
        } else if (raw && typeof raw === "object") {
          for (const [key, val] of Object.entries(raw)) {
            const sym = String(key).trim().toUpperCase();
            if (typeof val === "number") {
              nseStaticData[sym] = { company: sym, prevDelivPct: val, prevClose: null };
            } else if (val && typeof val === "object") {
              nseStaticData[sym] = {
                company: val.company || val.COMPANY || val.name || sym,
                prevDelivPct: parseFloat(val.prevDelivPct ?? val.DELIV_PER ?? val.deliv ?? 0) || 0,
                prevClose: parseFloat(val.prevClose ?? val.CLOSE_PRICE ?? val.close ?? 0) || null
              };
            }
          }
        }

        // Merge JSON metadata into existing stocks or load from JSON if no custom list saved
        const jsonKeys = Object.keys(nseStaticData);
        if (jsonKeys.length > 0) {
