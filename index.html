<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stock Ripple — Live NSE/BSE Screener</title>
<style>
  :root {
    --bg-main: #090b10;
    --bg-card: #10141d;
    --bg-hover: #161b26;
    --border: #1e2533;
    --text-main: #e2e8f0;
    --text-muted: #94a3b8;
    --green: #34d399;
    --green-bg: rgba(16, 185, 129, 0.14);
    --red: #fb7185;
    --red-bg: rgba(244, 63, 94, 0.14);
    --amber: #fbbf24;
  }
    * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.4;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  header {
    background: rgba(16, 20, 29, 0.95);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 20;
    padding: 12px 16px;
  }
  .header-inner {
    max-width: 1360px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    font-size: 16px;
    color: #fff;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
  }
  .brand span { color: var(--green); }
  .controls-top {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .status { font-size: 12px; color: var(--text-muted); margin-right: 4px; }
  button, .btn-label {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-main);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .btn-primary {
    background: var(--green-bg);
    color: var(--green);
    border-color: rgba(52, 211, 153, 0.35);
  }
  main {
    max-width: 1360px;
    margin: 0 auto;
    padding: 16px;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .card-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-muted);
  }
  .card-val {
    font-size: 24px;
    font-weight: 700;
    margin-top: 4px;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 16px;
  }
  .search-box {
    flex: 1 1 240px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 14px;
    color: #fff;
    font-size: 13px;
    outline: none;
  }
  .filter-group {
    display: flex;
    align-items: center;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px 10px;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .filter-group input {
    background: transparent;
    border: none;
    color: var(--green);
    font-weight: 700;
    width: 65px;
    font-size: 12px;
    outline: none;
  }
  .add-group {
    display: flex;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .add-group input {
    background: transparent;
    border: none;
    padding: 8px 10px;
    color: #fff;
    font-size: 12px;
    width: 125px;
    text-transform: uppercase;
    outline: none;
  }
  .add-group button {
    border: none;
    border-left: 1px solid var(--border);
    border-radius: 0;
    background: #182030;
    color: var(--green);
  }
  select {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: #fff;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 12px;
    outline: none;
  }
  .table-wrap {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
    min-width: 820px;
  }
  th {
    background: #0c0f16;
    color: var(--text-muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 11px 14px;
    border-bottom: 1px solid rgba(30, 37, 51, 0.7);
    font-size: 13px;
    white-space: nowrap;
  }
  tr:hover td { background: var(--bg-hover); }
  .right { text-align: right; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .neu { color: var(--text-main); }
  .badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge-pos { background: var(--green-bg); color: var(--green); }
  .badge-neg { background: var(--red-bg); color: var(--red); }
  .badge-neu { background: #1e2533; color: var(--text-muted); }
  .deliv-hi { background: rgba(251, 191, 36, 0.15); color: var(--amber); padding: 2px 6px; border-radius: 5px; }
  .company-cell { color: var(--text-muted); max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
  .del-btn { background: none; border: none; color: #475569; padding: 2px 6px; font-size: 13px; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="dot"></div>
      STOCK <span>RIPPLE</span>
    </div>
    <div class="controls-top">
      <span id="statusText" class="status mono">Ready</span>
      <button onclick="resetWatchlist()">Reset List</button>
      <label class="btn-label">
        <input type="checkbox" id="autoRefreshToggle" checked> Auto
      </label>
      <button class="btn-primary" onclick="fetchAllStocks()">Refresh</button>
    </div>
  </div>
</header>

<main>
  <div class="cards">
    <div class="card">
      <div class="card-label mono">Advances (≥₹100)</div>
      <div id="advancesCount" class="card-val mono pos">0</div>
    </div>
    <div class="card">
      <div class="card-label mono">Declines (≥₹100)</div>
      <div id="declinesCount" class="card-val mono neg">0</div>
    </div>
    <div class="card">
      <div class="card-label mono">Unchanged</div>
      <div id="unchangedCount" class="card-val mono">0</div>
    </div>
    <div class="card">
      <div class="card-label mono">Quotes Loaded</div>
      <div id="loadedCount" class="card-val mono" style="color:var(--amber)">0/0</div>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="searchInput" class="search-box" oninput="renderTable()" placeholder="Search symbol or company..." />

    <div class="filter-group mono">
      <span>MIN ₹</span>
      <input type="number" id="minPriceInput" value="100" oninput="updateSummaryCards(); renderTable();" />
    </div>

    <div class="add-group">
      <input type="text" id="newSymbolInput" class="mono" placeholder="TCS / 500325.BO" onkeydown="if(event.key==='Enter') addCustomSymbol()" />
      <button onclick="addCustomSymbol()">+ Add</button>
    </div>

    <label class="btn-label">
      Upload CSV
      <input type="file" accept=".csv,.txt" onchange="handleCSVUpload(event)" style="display:none" />
    </label>

    <select id="sortSelect" onchange="renderTable()">
      <option value="chgPctDesc">% Change ↓</option>
      <option value="chgPctAsc">% Change ↑</option>
      <option value="ltpDesc">LTP ↓</option>
      <option value="volDesc">Volume ↓</option>
      <option value="delivDesc">Prev Deliv % ↓</option>
    </select>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr class="mono">
          <th>#</th>
          <th>Symbol</th>
          <th>Company</th>
          <th class="right">LTP</th>
          <th class="right">Chg</th>
          <th class="right">Chg %</th>
          <th class="right">Day Low</th>
          <th class="right">Day High</th>
          <th class="right">Volume</th>
          <th class="right">Prev Deliv %</th>
          <th class="right">Updated</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="stockTableBody"></tbody>
    </table>
  </div>
</main>

<script>
function getItem(arr, idx) {
  if (!arr || !arr.length) return undefined;
  if (idx < 0) return arr.slice(idx).shift();
  return arr.slice(idx, idx + 1).shift();
}

const DEFAULT_SYMBOLS = RAW_NSE_LIST.map(function(s){
  var p = s.split('|');
  return { symbol: p[0], name: p[1] || p[0] };
});

const STORAGE_KEY = 'stockRipple_watchlist_v4';
let watchlist = DEFAULT_SYMBOLS.slice();
try {
  var saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    var parsed = JSON.parse(saved);
    if (Array.isArray(parsed) && parsed.length > 0) watchlist = parsed;
  } else {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_SYMBOLS));
  }
} catch(e) { watchlist = DEFAULT_SYMBOLS.slice(); }

let stockDataMap = {};
let nseDeliveryMap = {};
let sortBy = 'chgPctDesc';

function getMinPrice(){
  var v = parseFloat(document.getElementById('minPriceInput').value);
  return isNaN(v) ? 0 : v;
}

const CORS_PROXIES = [
  function(url){ return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url); },
  function(url){ return 'https://corsproxy.io/?url=' + encodeURIComponent(url); },
  function(url){ return 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url); }
];

async function fetchWithProxyFallback(targetUrl){
  for(let i=0;i<CORS_PROXIES.length;i++){
    try{
      const res = await fetch(CORS_PROXIES[i](targetUrl), {cache:'no-store'});
      if(res.ok) return await res.text();
    }catch(e){}
  }
  throw new Error('Proxy timeout');
}

async function fetchWithTimeout(url, ms){
  ms = ms || 8000;
  const ctrl = new AbortController();
  const t = setTimeout(function(){ ctrl.abort(); }, ms);
  try{
    const res = await fetch(url, { signal: ctrl.signal });
    return res;
  } finally { clearTimeout(t); }
}

function formatIndianVolume(num){
  if(!num || isNaN(num)) return '—';
  if(num>=10000000) return (num/10000000).toFixed(2)+' Cr';
  if(num>=100000) return (num/100000).toFixed(2)+' L';
  if(num>=1000) return (num/1000).toFixed(1)+' K';
  return num.toString();
}
function formatPrice(val){
  if(val===undefined || val===null || isNaN(val)) return '—';
  return val.toLocaleString('en-IN',{minimumFractionDigits:2, maximumFractionDigits:2});
}
function timeAgo(ts){
  if(!ts) return '—';
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return s+'s ago';
  if(s<3600) return Math.floor(s/60)+'m ago';
  return new Date(ts).toLocaleTimeString('en-IN');
}
function escapeHtml(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function getStooqSymbol(item){
  var sym = item.symbol.trim().toUpperCase();
  if(sym.indexOf('.BO') !== -1) return sym.replace('.BO','').toLowerCase() + '.bo';
  if(sym.indexOf('.NS') !== -1) return sym.replace('.NS','').toLowerCase() + '.ns';
  if(/^\d+$/.test(sym)) return sym.toLowerCase() + '.bo';
  return sym.toLowerCase() + '.ns';
}
function getYahooSymbol(item){
  var sym = item.symbol.trim().toUpperCase();
  if(sym.indexOf('.BO') !== -1) return sym.replace('.BO','') + '.BO';
  if(sym.indexOf('.NS') !== -1) return sym.replace('.NS','') + '.NS';
  if(/^\d+$/.test(sym)) return sym + '.BO';
  return sym + '.NS';
}
function isBSE(item){
  var sym = item.symbol.toUpperCase();
  return sym.indexOf('.BO') !== -1 || /^\d+$/.test(sym.trim());
}

async function fetchNSEDeliveryData(){
  for(let daysBack=1; daysBack<=4; daysBack++){
    const d=new Date(); d.setDate(d.getDate()-daysBack);
    const dd=String(d.getDate()).padStart(2,'0'), mm=String(d.getMonth()+1).padStart(2,'0'), yyyy=d.getFullYear();
    const mtoUrl='https://nseindia.com/api/reports?archives=%5B%7B%22name%22%3A%22CM%20-%20Daily%20MTO%22%2C%22type%22%3A%22archives%22%2C%22category%22%3A%22capital-market%22%2C%22section%22%3A%22equities%22%7D%5D&date='+dd+'-'+mm+'-'+yyyy+'&type=equities&mode=single';
    try{
      const raw=await fetchWithProxyFallback(mtoUrl);
      if(raw && raw.indexOf('20,') !== -1){
        raw.split('\n').forEach(function(line){
          const p=line.split(',');
          if(p[0] && p[0].trim()==='20' && p[3] && p[3].trim()==='EQ'){
            const sym=p[2].trim(); const deliv=parseFloat(p[6]);
            if(!isNaN(deliv)) nseDeliveryMap[sym]=deliv;
          }
        });
        if(Object.keys(nseDeliveryMap).length>50) break;
      }
    }catch(e){}
  }
}

async function fetchSingleStock(item){
  try{
    const url = 'https://stooq.com/q/l/?s=' + getStooqSymbol(item) + '&f=sd2t2ohlcv&h&e=csv';
    const res = await fetchWithTimeout(url, 8000);
    const text = await res.text();
    const lines = text.trim().split('\n');
    if(lines.length > 1){
      const parts = getItem(lines, 1).split(',');
      const open = parseFloat(parts[3]);
      const high = parseFloat(parts[4]);
      const low = parseFloat(parts[5]);
      const ltp = parseFloat(parts[6]);
      const volume = parseFloat(parts[7]);
      if(!isNaN(ltp) && ltp > 0){
        const chg = ltp - open;
        stockDataMap[item.symbol] = { symbol:item.symbol, name:item.name, ltp:ltp, chg:chg, chgPct: open ? (chg/open)*100 : 0, dayLow: low, dayHigh: high, volume: volume, updatedAt: Date.now(), prevDelivPct: isBSE(item) ? null : (nseDeliveryMap[item.symbol] !== undefined ? nseDeliveryMap[item.symbol] : null) };
        return;
      }
    }
  }catch(e){}

  try{
    const yahooUrl = 'https://query1.finance.yahoo.com/v8/finance/chart/' + getYahooSymbol(item) + '?interval=1d&range=2d';
    const raw = await fetchWithProxyFallback(yahooUrl);
    const json = JSON.parse(raw);
    const meta = json.chart.result[0].meta;
    const quote = json.chart.result[0].indicators.quote[0];
    const closes = quote.close.filter(function(v){ return v!==null; });
    const prevClose = closes.length>1 ? getItem(closes, -2) : meta.previousClose;
    const ltp = meta.regularMarketPrice;
    const chg = ltp - prevClose;
    stockDataMap[item.symbol] = { symbol:item.symbol, name:item.name, ltp:ltp, chg:chg, chgPct: (chg/prevClose)*100, dayLow: meta.regularMarketDayLow, dayHigh: meta.regularMarketDayHigh, volume: meta.regularMarketVolume, updatedAt: Date.now(), prevDelivPct: isBSE(item) ? null : (nseDeliveryMap[item.symbol] !== undefined ? nseDeliveryMap[item.symbol] : null) };
    return;
  }catch(e){}

  stockDataMap[item.symbol] = { symbol:item.symbol, name:item.name, ltp:null, chg:null, chgPct:null, dayLow:null, dayHigh:null, volume:null, updatedAt: Date.now(), prevDelivPct: isBSE(item) ? null : (nseDeliveryMap[item.symbol] !== undefined ? nseDeliveryMap[item.symbol] : null) };
}

async function fetchAllStocks(){
  document.getElementById('statusText').textContent='Loading...';
  await fetchNSEDeliveryData();
  for(let i=0; i<watchlist.length; i+=25){
    const batch = watchlist.slice(i, i+25);
    await Promise.allSettled(batch.map(function(s){ return fetchSingleStock(s); }));
    updateSummaryCards();
    renderTable();
    document.getElementById('statusText').textContent = 'Loading ' + Math.min(i+25, watchlist.length) + '/' + watchlist.length + '...';
    if(i+25 < watchlist.length) await new Promise(function(r){ setTimeout(r, 150); });
  }
  updateSummaryCards();
  renderTable();
  document.getElementById('statusText').textContent='Updated '+new Date().toLocaleTimeString('en-IN');
}

function updateSummaryCards(){
  var minP = getMinPrice();
  var adv=0, dec=0, unc=0, loaded=0;
  Object.values(stockDataMap).forEach(function(s){
    if(s.ltp==null) return; loaded++;
    if(s.ltp < minP) return;
    if(s.chgPct>0) adv++; else if(s.chgPct<0) dec++; else unc++;
  });
  document.getElementById('advancesCount').textContent=adv;
  document.getElementById('declinesCount').textContent=dec;
  document.getElementById('unchangedCount').textContent=unc;
  document.getElementById('loadedCount').textContent=loaded+'/'+watchlist.length;
  var advLabel = document.querySelectorAll('.card-label')[0];
  if(advLabel) advLabel.textContent = 'Advances (≥₹' + minP + ')';
  var decLabel = document.querySelectorAll('.card-label')[1];
  if(decLabel) decLabel.textContent = 'Declines (≥₹' + minP + ')';
}

function renderTable(){
  sortBy = document.getElementById('sortSelect').value;
  const search = (document.getElementById('searchInput').value||'').toLowerCase();
  const tbody = document.getElementById('stockTableBody');
  let rows = watchlist.map(function(w){ return stockDataMap[w.symbol] || {symbol:w.symbol, name:w.name, ltp:null, chg:null, chgPct:null, dayLow:null, dayHigh:null, volume:null, prevDelivPct:null, updatedAt:null}; });
  if(search) rows = rows.filter(function(r){ return r.symbol.toLowerCase().indexOf(search) !== -1 || r.name.toLowerCase().indexOf(search) !== -1; });

  rows.sort(function(a,b){
    function valA(v){ return (v===null||v===undefined?-Infinity:v); }
    if(sortBy==='chgPctDesc') return valA(b.chgPct)-valA(a.chgPct);
    if(sortBy==='chgPctAsc') return valA(a.chgPct)-valA(b.chgPct);
    if(sortBy==='ltpDesc') return valA(b.ltp)-valA(a.ltp);
    if(sortBy==='volDesc') return valA(b.volume)-valA(a.volume);
    if(sortBy==='delivDesc') return valA(b.prevDelivPct)-valA(a.prevDelivPct);
    return 0;
  });

  tbody.innerHTML = rows.map(function(r, idx){
    const isPos=r.chg>0, isNeg=r.chg<0;
    const colorClass=isPos?'pos':isNeg?'neg':'neu';
    const badgeClass=isPos?'badge badge-pos':isNeg?'badge badge-neg':'badge badge-neu';
    const arrow=isPos?'▲':isNeg?'▼':'•';
    const delivDisplay=r.prevDelivPct!==null && r.prevDelivPct!==undefined
      ? '<span class="mono ' + (r.prevDelivPct>=50?'deliv-hi':'') + '">' + r.prevDelivPct.toFixed(1) + '%</span>'
      : '<span style="color:#475569;font-size:12px">—</span>';
    return '<tr>' +
      '<td class="mono" style="color:#64748b;font-size:12px">' + (idx+1) + '</td>' +
      '<td class="mono" style="font-weight:700;color:#fff">' + escapeHtml(r.symbol) + '</td>' +
      '<td class="company-cell">' + escapeHtml(r.name) + '</td>' +
      '<td class="right mono" style="font-weight:600;color:#fff">' + formatPrice(r.ltp) + '</td>' +
      '<td class="right mono ' + colorClass + '">' + (r.chg!==null && r.chg!==undefined ? (r.chg>0?'+':'')+r.chg.toFixed(2) : '—') + '</td>' +
      '<td class="right"><span class="' + badgeClass + ' mono">' + arrow + ' ' + (r.chgPct!==null && r.chgPct!==undefined ? Math.abs(r.chgPct).toFixed(2)+'%' : '—') + '</span></td>' +
      '<td class="right mono" style="color:#94a3b8">' + formatPrice(r.dayLow) + '</td>' +
      '<td class="right mono" style="color:#94a3b8">' + formatPrice(r.dayHigh) + '</td>' +
      '<td class="right mono">' + formatIndianVolume(r.volume) + '</td>' +
      '<td class="right">' + delivDisplay + '</td>' +
      '<td class="right mono" style="font-size:12px;color:#64748b">' + timeAgo(r.updatedAt) + '</td>' +
      '<td class="right"><button class="del-btn" onclick="removeSymbol(\'' + escapeHtml(r.symbol) + '\')">✕</button></td>' +
    '</tr>';
  }).join('') || '<tr><td colspan="12" style="text-align:center;padding:24px;color:#64748b">No data - Click Refresh</td></tr>';
}

function addCustomSymbol(){
  const input=document.getElementById('newSymbolInput');
  let sym=input.value.trim().toUpperCase();
  if(!sym) return;
  if(!watchlist.some(function(w){ return w.symbol===sym; })){
    watchlist.unshift({symbol:sym, name: sym + (sym.indexOf('.BO')!==-1 || /^\d+$/.test(sym) ? ' (BSE)' : ' (NSE)')});
    localStorage.setItem(STORAGE_KEY, JSON.stringify(watchlist));
    renderTable();
    fetchSingleStock({symbol:sym, name:sym}).then(function(){ updateSummaryCards(); renderTable(); });
  }
  input.value='';
}

function handleCSVUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const text = ev.target.result;
    const lines = text.split('\n');
    let added = 0;
    lines.forEach(function(line){
      const parts = line.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
      if(!parts.length) return;
      let sym = parts[0].toUpperCase().replace('.NS','').replace(/['"]/g,'');
      if(sym === 'SYMBOL' || sym === 'TICKER') return;
      if(!watchlist.some(function(w){ return w.symbol===sym; })){
        watchlist.push({symbol:sym, name: parts[1] || (sym + ' (NSE)')});
        added++;
      }
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(watchlist));
    document.getElementById('statusText').textContent = 'Added ' + added + ' from CSV - Total ' + watchlist.length;
    renderTable();
    fetchAllStocks();
  };
  reader.readAsText(file);
  e.target.value = '';
}

function removeSymbol(sym){
  watchlist=watchlist.filter(function(w){ return w.symbol!==sym; });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(watchlist));
  updateSummaryCards();
  renderTable();
}

function resetWatchlist(){
  if(!confirm('Reset to default 130+ list?')) return;
  watchlist = DEFAULT_SYMBOLS.slice();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(watchlist));
  stockDataMap = {};
  renderTable();
  fetchAllStocks();
}

window.fetchAllStocks = fetchAllStocks;
window.addCustomSymbol = addCustomSymbol;
window.removeSymbol = removeSymbol;
window.renderTable = renderTable;
window.handleCSVUpload = handleCSVUpload;
window.resetWatchlist = resetWatchlist;
window.updateSummaryCards = updateSummaryCards;

setInterval(function(){
  if(document.getElementById('autoRefreshToggle').checked) fetchAllStocks();
},30000);

(function init(){
  renderTable();
  fetchAllStocks();
})();
</script>
</body>
</html>
