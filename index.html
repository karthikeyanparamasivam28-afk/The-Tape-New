<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stock Ripple — All NSE Stocks (≥₹100)</title>
<style>
  :root { --bg-main:#090b10; --bg-card:#10141d; --bg-hover:#161b26; --border:#1e2533; --text-main:#e2e8f0; --text-muted:#94a3b8; --green:#34d399; --green-bg:rgba(16,185,129,0.14); --red:#fb7185; --red-bg:rgba(244,63,94,0.14); --amber:#fbbf24; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg-main); color:var(--text-main); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; line-height:1.4; }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; }
  header { background:rgba(16,20,29,0.95); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20; padding:12px 16px; }
  .header-inner { max-width:1360px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  .brand { display:flex; align-items:center; gap:8px; font-weight:800; font-size:16px; color:#fff; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); }
  .brand span { color:var(--green); }
  .controls-top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .status { font-size:12px; color:var(--text-muted); margin-right:4px; }
  button { background:var(--bg-card); border:1px solid var(--border); color:var(--text-main); padding:6px 12px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; }
  button:hover { background:var(--bg-hover); }
  .btn-primary { background:var(--green-bg); color:var(--green); border-color:rgba(52,211,153,0.35); }
  main { max-width:1360px; margin:0 auto; padding:16px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:16px; }
  .card { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
  .card-label { font-size:11px; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-muted); }
  .card-val { font-size:24px; font-weight:700; margin-top:4px; }
  .toolbar { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
  .search-box { flex:1 1 240px; background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:9px 14px; color:#fff; font-size:13px; outline:none; }
  .filter-group { display:flex; align-items:center; background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:4px 10px; gap:6px; font-size:12px; color:var(--text-muted); }
  .filter-group input { background:transparent; border:none; color:var(--green); font-weight:700; width:75px; font-size:12px; outline:none; }
  select { background:var(--bg-card); border:1px solid var(--border); color:#fff; padding:8px 12px; border-radius:10px; font-size:12px; outline:none; }
  .table-wrap { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; text-align:left; min-width:860px; }
  th { background:#0c0f16; color:var(--text-muted); font-size:11px; text-transform:uppercase; letter-spacing:0.5px; padding:12px 14px; border-bottom:1px solid var(--border); }
  td { padding:11px 14px; border-bottom:1px solid rgba(30,37,51,0.7); font-size:13px; white-space:nowrap; }
  tr:hover td { background:var(--bg-hover); }
  .right { text-align:right; } .pos { color:var(--green); } .neg { color:var(--red); } .neu { color:var(--text-main); }
  .badge { display:inline-block; padding:3px 8px; border-radius:6px; font-size:12px; font-weight:600; }
  .badge-pos { background:var(--green-bg); color:var(--green); } .badge-neg { background:var(--red-bg); color:var(--red); } .badge-neu { background:#1e2533; color:var(--text-muted); }
  .company-cell { color:var(--text-muted); max-width:220px; overflow:hidden; text-overflow:ellipsis; }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand"><div class="dot"></div>STOCK <span>RIPPLE</span></div>
    <div class="controls-top">
      <span id="statusText" class="status mono">Loading NSE data...</span>
      <button class="btn-primary" onclick="loadData()">Reload Data</button>
    </div>
  </div>
</header>

<main>
  <div class="cards">
    <div class="card"><div class="card-label mono">Advances (≥Min ₹)</div><div id="advancesCount" class="card-val mono pos">0</div></div>
    <div class="card"><div class="card-label mono">Declines (≥Min ₹)</div><div id="declinesCount" class="card-val mono neg">0</div></div>
    <div class="card"><div class="card-label mono">Unchanged</div><div id="unchangedCount" class="card-val mono">0</div></div>
    <div class="card"><div class="card-label mono">NSE Stocks ≥Min ₹</div><div id="totalCount" class="card-val mono" style="color:var(--amber)">0</div></div>
  </div>

  <div class="toolbar">
    <input type="text" id="searchInput" class="search-box" oninput="renderTable()" placeholder="Search symbol or company..." />
    <div class="filter-group mono"><span>MIN ₹</span><input type="number" id="minPriceInput" value="100" oninput="renderTable()" /></div>
    <div class="filter-group mono"><span>MAX ₹</span><input type="number" id="maxPriceInput" placeholder="Any" oninput="renderTable()" /></div>
    <select id="moveFilter" onchange="renderTable()">
      <option value="all">All Stocks</option>
      <option value="gainers">Gainers Only (+)</option>
      <option value="losers">Losers Only (-)</option>
    </select>
    <select id="sortSelect" onchange="renderTable()">
      <option value="chgPctDesc">% Change ↓ (Top Gainers)</option>
      <option value="chgPctAsc">% Change ↑ (Top Losers)</option>
      <option value="ltpDesc">Price ↓</option>
      <option value="ltpAsc">Price ↑</option>
      <option value="volDesc">Volume ↓</option>
    </select>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr class="mono">
          <th>#</th>
          <th>Symbol</th>
          <th>Company</th>
          <th class="right">LTP (₹)</th>
          <th class="right">Chg (₹)</th>
          <th class="right">Chg %</th>
          <th class="right">Prev Close</th>
          <th class="right">Day Low</th>
          <th class="right">Day High</th>
          <th class="right">Volume</th>
        </tr>
      </thead>
      <tbody id="stockTableBody"></tbody>
    </table>
  </div>
</main>

<script>
let allStocks = [];

async function loadData() {
  const statusEl = document.getElementById("statusText");
  statusEl.textContent = "Fetching nse_data.json...";
  try {
    const res = await fetch(`./nse_data.json?t=${Date.now()}`);
    if (!res.ok) throw new Error("nse_data.json not found — run GitHub Action first");
    const payload = await res.json();
    allStocks = payload.stocks || [];
    statusEl.textContent = `Updated: ${payload.updated} (${allStocks.length} NSE stocks ≥₹100)`;
    renderTable();
  } catch (err) {
    statusEl.textContent = err.message;
  }
}

function renderTable() {
  const tbody = document.getElementById("stockTableBody");
  const query = document.getElementById("searchInput").value.trim().toLowerCase();
  const minPrice = parseFloat(document.getElementById("minPriceInput").value) || 100;
  const maxPrice = parseFloat(document.getElementById("maxPriceInput").value) || Infinity;
  const move = document.getElementById("moveFilter").value;
  const sortBy = document.getElementById("sortSelect").value;

  let filtered = allStocks.filter(s => {
    if (s.ltp < minPrice || s.ltp > maxPrice) return false;
    if (move === "gainers" && s.chg <= 0) return false;
    if (move === "losers" && s.chg >= 0) return false;
    if (query && !s.symbol.toLowerCase().includes(query) && !s.name.toLowerCase().includes(query)) return false;
    return true;
  });

  let adv = 0, dec = 0, unch = 0;
  filtered.forEach(s => {
    if (s.chg > 0) adv++;
    else if (s.chg < 0) dec++;
    else unch++;
  });

  document.getElementById("advancesCount").textContent = adv;
  document.getElementById("declinesCount").textContent = dec;
  document.getElementById("unchangedCount").textContent = unch;
  document.getElementById("totalCount").textContent = filtered.length;

  filtered.sort((a, b) => {
    if (sortBy === "chgPctDesc") return b.chgPct - a.chgPct;
    if (sortBy === "chgPctAsc") return a.chgPct - b.chgPct;
    if (sortBy === "ltpDesc") return b.ltp - a.ltp;
    if (sortBy === "ltpAsc") return a.ltp - b.ltp;
    if (sortBy === "volDesc") return b.vol - a.vol;
    return 0;
  });

  tbody.innerHTML = filtered.map((s, idx) => {
    const cls = s.chg > 0 ? "pos" : s.chg < 0 ? "neg" : "neu";
    const badgeCls = s.chg > 0 ? "badge-pos" : s.chg < 0 ? "badge-neg" : "badge-neu";
    const sign = s.chg > 0 ? "+" : "";
    return `
      <tr>
        <td class="mono" style="color:var(--text-muted)">${idx + 1}</td>
        <td class="mono" style="font-weight:700;color:#fff">${s.symbol}</td>
        <td class="company-cell" title="${s.name}">${s.name}</td>
        <td class="right mono" style="font-weight:700">₹${s.ltp.toFixed(2)}</td>
        <td class="right mono ${cls}">${sign}${s.chg.toFixed(2)}</td>
        <td class="right mono"><span class="badge ${badgeCls}">${sign}${s.chgPct.toFixed(2)}%</span></td>
        <td class="right mono" style="color:var(--text-muted)">₹${s.prevClose.toFixed(2)}</td>
        <td class="right mono">₹${s.low.toFixed(2)}</td>
        <td class="right mono">₹${s.high.toFixed(2)}</td>
        <td class="right mono">${s.vol.toLocaleString("en-IN")}</td>
      </tr>
    `;
  }).join("");
}
 loadData();
setInterval(loadData, 50000); // Auto-refreshes every 10 minutes during market hours
</script>
</body>
</html>
