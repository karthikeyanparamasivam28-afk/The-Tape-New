name: Fetch NSE Stocks Above 100
on:
  schedule:
    - cron: '*/5 3-10 * * 1-5' # Runs every 15 mins during NSE market hours (Mon-Fri)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --upgrade yfinance pandas
      - name: Fetch All NSE Stocks >= 100
        run: |
          python - << 'EOF'
          import json, time, pandas as pd, yfinance as yf
          from datetime import datetime, timezone, timedelta

          # 1. Read your uploaded EQUITY_L.csv directly from the repository
          df = pd.read_csv("EQUITY_L.csv")
          df.columns = [c.strip().upper() for c in df.columns]
          df["SERIES"] = df["SERIES"].astype(str).str.strip()
          df = df[df["SERIES"].isin(["EQ", "BE"])]

          name_map = dict(zip(
              df["SYMBOL"].astype(str).str.strip(),
              df["NAME OF COMPANY"].astype(str).str.strip()
          ))
          all_symbols = [s for s in name_map.keys() if s and s.lower() != "nan"]
          print(f"Loaded {len(all_symbols)} NSE symbols from EQUITY_L.csv")

          results = []
          chunk_size = 250

          for i in range(0, len(all_symbols), chunk_size):
              chunk = all_symbols[i:i + chunk_size]
              tickers = [f"{s}.NS" for s in chunk]
              print(f"Fetching quotes {i + 1} to {i + len(chunk)}...")
              try:
                  data = yf.download(
                      tickers,
                      period="5d",
                      group_by="ticker",
                      threads=True,
                      progress=False
                  )
              except Exception as e:
                  print(f"Batch {i} warning: {e}")
                  continue

              for sym in chunk:
                  t = f"{sym}.NS"
                  try:
                      if isinstance(data.columns, pd.MultiIndex):
                          if t not in data.columns.get_level_values(0):
                              continue
                          sub = data[t]
                      else:
                          sub = data

                      sub = sub.dropna(subset=["Close"])
                      if len(sub) == 0:
                          continue

                      last = sub.iloc[-1]
                      ltp = round(float(last["Close"]), 2)

                      # Keep only stocks strictly >= Rs. 100
                      if ltp < 100.0:
                          continue

                      prev = round(float(sub.iloc[-2]["Close"]), 2) if len(sub) >= 2 else ltp
                      chg = round(ltp - prev, 2)
                      chg_pct = round((chg / prev) * 100, 2) if prev else 0.0

                      results.append({
                          "symbol": sym,
                          "name": name_map.get(sym, sym),
                          "ltp": ltp,
                          "chg": chg,
                          "chgPct": chg_pct,
                          "prevClose": prev,
                          "low": round(float(last["Low"]), 2) if pd.notna(last["Low"]) else ltp,
                          "high": round(float(last["High"]), 2) if pd.notna(last["High"]) else ltp,
                          "vol": int(last["Volume"]) if pd.notna(last["Volume"]) else 0
                      })
                  except Exception:
                      continue

              time.sleep(1)

          # Sort by % Change descending by default
          results.sort(key=lambda x: x["chgPct"], reverse=True)

          ist = timezone(timedelta(hours=5, minutes=30))
          updated_at = datetime.now(ist).strftime("%d %b %Y, %I:%M %p IST")

          with open("nse_data.json", "w") as f:
              json.dump({
                  "updated": updated_at,
                  "count": len(results),
                  "stocks": results
              }, f)

          print(f"SUCCESS: Saved {len(results)} NSE stocks >= Rs. 100 to nse_data.json")
          EOF
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add nse_data.json
          git commit -m "Update NSE stock prices (>= 100)" || exit 0
          git push
